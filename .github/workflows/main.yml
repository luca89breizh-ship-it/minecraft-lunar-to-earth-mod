name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge]
    defaults:
      run:
        working-directory: lunaire/lunaire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew -p ${{ matrix.loader }} build
      - uses: actions/upload-artifact@v4
        with:
          name: lunaire-${{ matrix.loader }}
          path: lunaire/lunaire/${{ matrix.loader }}/build/libs/*.jar
