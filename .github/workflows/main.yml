name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lunaire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Générer textures, données et structures
        run: python3 tools/gen_all.py
      - name: Compiler le mod Fabric
        run: |
          chmod +x gradlew
          ./gradlew -p fabric build
      - uses: actions/upload-artifact@v4
        with:
          name: lunaire-fabric
          path: lunaire/fabric/build/libs/*.jar
