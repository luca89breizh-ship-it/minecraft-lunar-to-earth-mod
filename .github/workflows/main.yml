name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dézipper le projet
        run: |
          ls -la
          unzip -q projet.zip -d _proj
          ls _proj/lunaire
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Générer textures, données et structures
        working-directory: _proj/lunaire
        run: python3 tools/gen_all.py
      - name: Compiler le mod Fabric
        working-directory: _proj/lunaire
        run: |
          chmod +x gradlew
          ./gradlew -p fabric build
      - uses: actions/upload-artifact@v4
        with:
          name: lunaire-fabric
          path: _proj/lunaire/fabric/build/libs/*.jar
