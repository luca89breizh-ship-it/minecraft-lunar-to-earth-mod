plugins {
    id 'java'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

// Code et ressources partagés avec la version Fabric.
// (Forge ne génère pas pack.mcmeta : il est fourni dans forge/src/main/resources.)
sourceSets {
    main {
        java.srcDir '../common/src/main/java'
        resources.srcDir '../common/src/main/resources'
    }
}

// ATTENTION : bloc reconstitué d'après ForgeGradle 7. En cas d'erreur, comparez avec
// le MDK officiel 26.3-66.1.0 (https://files.minecraftforge.net/net/minecraftforge/forge/index_26.3.html).
repositories {
    mavenCentral()
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

minecraft {
    // 26.x n'est pas obfusqué : aucun mapping à déclarer.
}

minecraft.runs {
    configureEach {
        workingDir.set(file('run'))
        modSource project.sourceSets.main
    }
    client { }
    server {
        args '--nogui'
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id     : mod_id,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
